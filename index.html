<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>말하기 수행평가</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Poppins:wght@500;600;700;800&display=swap">

<style>
/* Layout: full-screen, card-based, mobile-first */
:root {
  --bg:      #F5F6FB;
  --surface: #FFFFFF;
  --fg:      #18192A;
  --muted:   #6B7280;
  --border:  #E4E6F2;
  --accent:  #4B6CF5;
  --accent2: #7C3AED;
  --tts:     #059669;
  --rec:     #DC2626;
  --success: #10B981;
  --warn:    #F59E0B;
  --danger:  #EF4444;
  --radius:  18px;
  --shadow:  0 4px 20px rgba(75,108,245,.1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0D0F1A; --surface:#161929; --fg:#EEF0FA; --muted:#8B93A8;
    --border:#252840; --accent:#6B87FF; --accent2:#A78BFA;
    --tts:#34D399; --rec:#F87171;
    --success:#34D399; --warn:#FBBF24; --danger:#F87171;
    --shadow:0 4px 20px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0D0F1A; --surface:#161929; --fg:#EEF0FA; --muted:#8B93A8;
  --border:#252840; --accent:#6B87FF; --accent2:#A78BFA;
  --tts:#34D399; --rec:#F87171;
  --success:#34D399; --warn:#FBBF24; --danger:#F87171;
  --shadow:0 4px 20px rgba(0,0,0,.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html, body {
  height: 100%;
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg); color: var(--fg);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}

.app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-title { font-family:'Poppins',sans-serif; font-size:.95rem; font-weight:800; color:var(--accent) }
.header-sub { font-size:.65rem; color:var(--muted); margin-top:1px }

/* Tabs */
.tab-bar {
  display: flex; gap: 8px;
  padding: 10px max(16px,env(safe-area-inset-left,0px));
  padding-right: max(16px,env(safe-area-inset-right,0px));
  background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink:0;
}
.tab-btn {
  flex:1; padding:9px 4px; border:none; border-radius:10px;
  font-family:'Noto Sans KR',sans-serif; font-size:.73rem; font-weight:700;
  cursor:pointer; background:var(--bg); color:var(--muted);
  transition:background .18s, color .18s;
}
.tab-btn.active { background:var(--accent); color:#fff }

/* Body scroll */
.body {
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding: 16px max(16px,env(safe-area-inset-left,0px));
  padding-right: max(16px,env(safe-area-inset-right,0px));
  padding-bottom: max(20px,env(safe-area-inset-bottom,0px));
}

.screen { display:none }
.screen.active { display:block }

/* Progress */
.progress-row { display:flex; align-items:center; gap:10px; margin-bottom:14px }
.progress-label { font-size:.75rem; color:var(--muted); font-weight:700; flex-shrink:0; font-variant-numeric:tabular-nums }
.progress-bar { flex:1; height:6px; border-radius:3px; background:var(--border); overflow:hidden }
.progress-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .35s ease }
.score-badges { display:flex; gap:5px; flex-shrink:0 }
.badge { font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:20px }
.badge-o { background:rgba(16,185,129,.15); color:var(--success) }
.badge-x { background:rgba(239,68,68,.1); color:var(--danger) }

/* Flip card */
.card-wrap { perspective:1000px; margin-bottom:14px }
.flip-card {
  position:relative; width:100%; min-height:190px;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,0,.2,1);
  cursor:pointer;
}
.flip-card.flipped { transform:rotateY(180deg) }
.card-face {
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:var(--radius); padding:22px 20px;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; min-height:190px;
}
.card-front { background:var(--surface); border:2px solid var(--border); box-shadow:var(--shadow) }
.card-back { background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%); transform:rotateY(180deg) }
.card-num { font-size:.65rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px }
.card-front .card-num { color:var(--accent) }
.card-back .card-num { color:rgba(255,255,255,.65) }
.card-korean { font-size:1.08rem; font-weight:700; line-height:1.6; color:var(--fg) }
.card-english { font-family:'Poppins',sans-serif; font-size:.9rem; font-weight:600; line-height:1.65; color:#fff }
.card-tap-hint {
  margin-top:12px; font-size:.65rem; font-weight:600;
  display:flex; align-items:center; gap:3px;
}
.card-front .card-tap-hint { color:var(--muted) }
.card-front .card-tap-hint::before { content:'👆 탭하면 영어 정답 공개' }
.card-back .card-tap-hint { color:rgba(255,255,255,.55) }
.card-back .card-tap-hint::before { content:'👆 탭하면 한국어로 돌아가기' }

/* TTS & Rec buttons row below card */
.action-row {
  display:flex; gap:8px; margin-bottom:12px;
  opacity:0; pointer-events:none;
  transition:opacity .3s;
}
.action-row.visible { opacity:1; pointer-events:auto }
.act-btn {
  flex:1; padding:11px 8px; border:none; border-radius:12px;
  font-family:'Noto Sans KR',sans-serif; font-size:.8rem; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
  transition:transform .12s, opacity .15s;
}
.act-btn:active { transform:scale(.94) }
.act-btn:disabled { opacity:.35; cursor:not-allowed }
.btn-tts { background:rgba(5,150,105,.12); color:var(--tts); border:1.5px solid var(--tts) }
.btn-tts.speaking { background:rgba(5,150,105,.25); animation:pulse-tts 1s infinite }
.btn-rec { background:rgba(220,38,38,.08); color:var(--rec); border:1.5px solid var(--rec) }
.btn-rec.recording { background:rgba(220,38,38,.2); animation:pulse-rec 0.7s infinite }
@keyframes pulse-tts { 0%,100%{box-shadow:0 0 0 0 rgba(5,150,105,.3)} 50%{box-shadow:0 0 0 6px rgba(5,150,105,0)} }
@keyframes pulse-rec { 0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35)} 50%{box-shadow:0 0 0 7px rgba(220,38,38,0)} }

/* Pronunciation result panel */
.pron-panel {
  background:var(--surface); border-radius:14px;
  border:1.5px solid var(--border);
  padding:14px 16px; margin-bottom:12px;
  display:none;
}
.pron-panel.show { display:block }
.pron-title { font-size:.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px }
.pron-score-row { display:flex; align-items:center; gap:10px; margin-bottom:10px }
.pron-score-circle {
  width:52px; height:52px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Poppins',sans-serif; font-size:1.1rem; font-weight:800;
  border:3px solid;
}
.pron-score-high { border-color:var(--success); color:var(--success); background:rgba(16,185,129,.08) }
.pron-score-mid  { border-color:var(--warn); color:var(--warn); background:rgba(245,158,11,.08) }
.pron-score-low  { border-color:var(--danger); color:var(--danger); background:rgba(239,68,68,.08) }
.pron-msg { font-size:.82rem; font-weight:600; line-height:1.5 }
.pron-words { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px }
.pw {
  padding:4px 10px; border-radius:20px;
  font-family:'Poppins',sans-serif; font-size:.8rem; font-weight:600;
}
.pw-ok  { background:rgba(16,185,129,.15); color:var(--success) }
.pw-ok::after { content:' ✓' }
.pw-no  { background:rgba(239,68,68,.12); color:var(--danger) }
.pw-no::after { content:' ✗' }
.pron-heard { font-size:.72rem; color:var(--muted); line-height:1.5 }
.pron-heard strong { color:var(--fg); font-style:italic }
.pron-no-support {
  font-size:.78rem; color:var(--warn); font-weight:600;
  background:rgba(245,158,11,.1); border-radius:10px; padding:10px 12px;
  text-align:center;
}

/* Judge buttons */
.judge-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px }
.judge-btn {
  padding:13px; border:none; border-radius:12px;
  font-family:'Noto Sans KR',sans-serif; font-size:.88rem; font-weight:700;
  cursor:pointer; transition:transform .12s; display:flex; align-items:center; justify-content:center; gap:5px;
}
.judge-btn:active { transform:scale(.95) }
.judge-btn.ok { background:rgba(16,185,129,.13); color:var(--success); border:2px solid var(--success) }
.judge-btn.no { background:rgba(239,68,68,.07); color:var(--danger); border:2px solid var(--danger) }
.judge-btn:disabled { opacity:.3; cursor:not-allowed }

/* Nav */
.nav-row { display:flex; gap:10px; margin-bottom:16px }
.nav-btn {
  flex:1; padding:11px; border-radius:11px; border:2px solid var(--border);
  background:var(--surface); color:var(--fg);
  font-family:'Noto Sans KR',sans-serif; font-size:.82rem; font-weight:700; cursor:pointer;
  transition:border-color .15s;
}
.nav-btn:hover { border-color:var(--accent) }
.nav-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff }

/* Result */
.result-card {
  background:var(--surface); border-radius:var(--radius); padding:24px 20px;
  text-align:center; box-shadow:var(--shadow); margin-top:4px;
}
.result-emoji { font-size:2.8rem; margin-bottom:10px }
.result-title { font-size:1.2rem; font-weight:900; margin-bottom:5px }
.result-sub { font-size:.82rem; color:var(--muted); line-height:1.6 }
.result-score {
  font-family:'Poppins',sans-serif; font-size:3.2rem; font-weight:800;
  color:var(--accent); line-height:1; margin:14px 0 8px;
}
.result-score span { font-size:1.3rem; color:var(--muted) }
.wrong-list { margin-top:16px; text-align:left; border-top:1px solid var(--border); padding-top:14px }
.wrong-list h4 { font-size:.72rem; font-weight:700; color:var(--muted); margin-bottom:9px; text-transform:uppercase; letter-spacing:.06em }
.wrong-item {
  background:rgba(239,68,68,.05); border-radius:10px; padding:9px 12px;
  margin-bottom:7px; border-left:3px solid var(--danger);
}
.wrong-item .kr { font-size:.78rem; color:var(--muted); margin-bottom:3px }
.wrong-item .en { font-size:.85rem; font-weight:600; font-family:'Poppins',sans-serif; color:var(--fg); line-height:1.5 }

/* Mode 2 */
.challenge-header {
  display:flex; align-items:flex-start; justify-content:space-between;
  margin-bottom:16px; gap:12px;
}
.challenge-title { font-size:.95rem; font-weight:900 }
.challenge-desc { font-size:.73rem; color:var(--muted); margin-top:2px }

/* Timer */
.timer-wrap { flex-shrink:0; position:relative; width:72px; height:72px }
.timer-svg { width:72px; height:72px; transform:rotate(-90deg) }
.timer-track { fill:none; stroke:var(--border); stroke-width:5 }
.timer-arc {
  fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round;
  stroke-dasharray:201.06; stroke-dashoffset:0;
  transition:stroke-dashoffset .95s linear, stroke .3s;
}
.timer-num {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:'Poppins',sans-serif; font-size:1.3rem; font-weight:800;
  font-variant-numeric:tabular-nums; color:var(--fg); transition:color .3s;
}

/* Sentence list */
.sentence-list { display:flex; flex-direction:column; gap:9px; margin-bottom:18px }
.sentence-item {
  background:var(--surface); border:1.5px solid var(--border); border-radius:13px;
  padding:12px 14px; display:flex; gap:10px; align-items:flex-start;
  transition:border-color .2s;
}
.sentence-item.revealed { border-color:var(--accent2) }
.s-num {
  flex-shrink:0; width:25px; height:25px; border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; font-family:'Poppins',sans-serif; font-size:.72rem; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.s-body { flex:1; min-width:0 }
.s-korean { font-size:.87rem; font-weight:700; line-height:1.55; color:var(--fg) }
.s-english {
  margin-top:6px; font-family:'Poppins',sans-serif;
  font-size:.79rem; font-weight:500; line-height:1.6; color:var(--accent2); display:none;
}
.s-english.show { display:block }
.s-btn-row { display:flex; gap:6px; margin-top:8px }
.s-tts-btn {
  padding:5px 12px; border:1.5px solid var(--tts); border-radius:20px;
  background:rgba(5,150,105,.08); color:var(--tts);
  font-family:'Noto Sans KR',sans-serif; font-size:.72rem; font-weight:700;
  cursor:pointer; display:flex; align-items:center; gap:4px;
}
.s-tts-btn.speaking { background:rgba(5,150,105,.22); animation:pulse-tts .9s infinite }

/* Controls */
.ctrl-row { display:flex; gap:10px; margin-bottom:14px }
.ctrl-btn {
  flex:1; padding:13px; border:none; border-radius:13px;
  font-family:'Noto Sans KR',sans-serif; font-size:.9rem; font-weight:700;
  cursor:pointer; transition:opacity .15s, transform .12s;
}
.ctrl-btn:active { transform:scale(.96) }
.ctrl-btn.start { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff }
.ctrl-btn.reset { background:var(--surface); color:var(--fg); border:2px solid var(--border) }
.ctrl-btn:disabled { opacity:.35; cursor:not-allowed }

/* Finish banner */
.finish-banner {
  display:none; background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:13px; padding:16px 18px; text-align:center; color:#fff; margin-bottom:12px;
}
.finish-banner.show { display:block }
.finish-banner h3 { font-size:1rem; font-weight:900 }
.finish-banner p { font-size:.78rem; margin-top:4px; opacity:.85 }
.reveal-all-btn {
  margin-top:10px; padding:8px 18px;
  background:rgba(255,255,255,.22); border:1.5px solid rgba(255,255,255,.45);
  border-radius:30px; color:#fff;
  font-family:'Noto Sans KR',sans-serif; font-size:.77rem; font-weight:700; cursor:pointer;
}
.shuffle-info { font-size:.7rem; color:var(--muted); text-align:center; margin-bottom:12px }

/* Rec unsupported notice */
.rec-notice {
  font-size:.72rem; text-align:center; color:var(--muted);
  margin-bottom:8px; padding:8px 12px;
  background:rgba(245,158,11,.08); border-radius:10px; border:1px solid rgba(245,158,11,.2);
  display:none;
}

@media (prefers-reduced-motion:reduce) { .flip-card,.timer-arc { transition:none } }
</style>

<div class="app">

  <header class="header">
    <div>
      <div class="header-title">🗣 Speaking Test</div>
      <div class="header-sub">윤슬중학교 2학년 · 말하기 수행평가</div>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab1" onclick="switchTab(1)">📖 모드 1: 한→영</button>
    <button class="tab-btn" id="tab2" onclick="switchTab(2)">⏱ 모드 2: 1분 챌린지</button>
  </div>

  <div class="body">

    <!-- ── Mode 1 ─────────────────────────────────────────── -->
    <div class="screen active" id="screen1">

      <div class="progress-row">
        <span class="progress-label" id="prog-label">1 / 25</span>
        <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:4%"></div></div>
        <div class="score-badges">
          <span class="badge badge-o" id="score-o">⭕ 0</span>
          <span class="badge badge-x" id="score-x">❌ 0</span>
        </div>
      </div>

      <!-- Flip card -->
      <div class="card-wrap">
        <div class="flip-card" id="flipCard" onclick="flipCard()">
          <div class="card-face card-front">
            <span class="card-num" id="card-num-front">No. 1</span>
            <div class="card-korean" id="card-korean"></div>
            <span class="card-tap-hint"></span>
          </div>
          <div class="card-face card-back">
            <span class="card-num" id="card-num-back">No. 1</span>
            <div class="card-english" id="card-english"></div>
            <span class="card-tap-hint"></span>
          </div>
        </div>
      </div>

      <!-- TTS + Rec actions (visible after flip) -->
      <div class="action-row" id="actionRow">
        <button class="act-btn btn-tts" id="btnTts" onclick="speakCard()">🔊 영어 듣기</button>
        <button class="act-btn btn-rec" id="btnRec" onclick="startRec()">🎤 발음 체크</button>
      </div>

      <!-- Rec not supported notice -->
      <div class="rec-notice" id="recNotice">
        ⚠️ 이 환경에서는 마이크 인식이 지원되지 않습니다. 자가채점을 이용해 주세요.
      </div>

      <!-- Pronunciation panel -->
      <div class="pron-panel" id="pronPanel">
        <div class="pron-title">📊 발음 평가 결과</div>
        <div class="pron-score-row">
          <div class="pron-score-circle" id="pronCircle">-</div>
          <div class="pron-msg" id="pronMsg"></div>
        </div>
        <div class="pron-words" id="pronWords"></div>
        <div class="pron-heard" id="pronHeard"></div>
      </div>

      <!-- Judge -->
      <div class="judge-row">
        <button class="judge-btn ok" id="btnOk" onclick="judge(true)" disabled>⭕ 맞혔어요</button>
        <button class="judge-btn no" id="btnNo" onclick="judge(false)" disabled>❌ 틀렸어요</button>
      </div>

      <div class="nav-row">
        <button class="nav-btn" onclick="restartM1()">🔀 다시 시작</button>
        <button class="nav-btn primary" onclick="judge(false)">다음 →</button>
      </div>

      <div id="result-wrap" hidden>
        <div class="result-card">
          <div class="result-emoji" id="result-emoji">🎉</div>
          <div class="result-title" id="result-title">완료!</div>
          <div class="result-score" id="result-score">0<span> / 25</span></div>
          <div class="result-sub" id="result-sub"></div>
          <div class="wrong-list" id="wrong-list" hidden>
            <h4>다시 연습할 문장</h4>
            <div id="wrong-items"></div>
          </div>
          <button class="nav-btn primary" style="width:100%;margin-top:16px" onclick="restartM1()">🔀 처음부터 다시</button>
        </div>
      </div>

    </div><!-- /screen1 -->

    <!-- ── Mode 2 ─────────────────────────────────────────── -->
    <div class="screen" id="screen2">

      <div class="challenge-header">
        <div>
          <div class="challenge-title">⏱ 1분 스피킹 챌린지</div>
          <div class="challenge-desc">한국어를 보고 영어로 말하세요!</div>
        </div>
        <div class="timer-wrap">
          <svg class="timer-svg" viewBox="0 0 74 74">
            <circle class="timer-track" cx="37" cy="37" r="32"/>
            <circle class="timer-arc" id="timerArc" cx="37" cy="37" r="32"/>
          </svg>
          <div class="timer-num" id="timerNum">60</div>
        </div>
      </div>

      <div class="finish-banner" id="finishBanner">
        <h3>⏰ 시간 종료!</h3>
        <p>정답을 확인하고 다시 들어보세요</p>
        <button class="reveal-all-btn" onclick="revealAll()">📖 전체 정답 보기</button>
      </div>

      <div class="shuffle-info">📋 랜덤 선택된 6문장</div>
      <div class="sentence-list" id="sentenceList"></div>

      <div class="ctrl-row">
        <button class="ctrl-btn reset" onclick="newChallenge()">🔀 새 문장 뽑기</button>
        <button class="ctrl-btn start" id="startBtn" onclick="startTimer()">▶ 시작!</button>
      </div>

    </div><!-- /screen2 -->

  </div>
</div>

<script>
/* ── Sentence data ─────────────────────────────────────────────── */

/* ── TTS ─────────────────────────────────────────────────────── */
const synth = window.speechSynthesis;
let ttsUtterance = null;

function speakText(text, onEnd) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.88;
  u.pitch = 1.0;
  // prefer a natural English voice
  const voices = synth.getVoices();
  const preferred = voices.find(v => /en-(US|GB|AU)/i.test(v.lang) && !v.name.includes('Google') === false)
    || voices.find(v => /en/i.test(v.lang));
  if (preferred) u.voice = preferred;
  if (onEnd) u.onend = onEnd;
  ttsUtterance = u;
  synth.speak(u);
}

function speakCard() {
  const text = SENTENCES[m1Order[m1Idx]].en;
  const btn = document.getElementById('btnTts');
  btn.classList.add('speaking');
  btn.textContent = '🔊 재생 중…';
  btn.disabled = true;
  speakText(text, () => {
    btn.classList.remove('speaking');
    btn.textContent = '🔊 영어 듣기';
    btn.disabled = false;
  });
}

function speakSentence(idx, btnEl) {
  const text = SENTENCES[m2Sentences[idx]].en;
  document.querySelectorAll('.s-tts-btn').forEach(b => {
    b.classList.remove('speaking'); b.textContent = '🔊 듣기';
  });
  btnEl.classList.add('speaking');
  btnEl.textContent = '🔊 재생 중…';
  speakText(text, () => {
    btnEl.classList.remove('speaking');
    btnEl.textContent = '🔊 듣기';
  });
}

/* ── SpeechRecognition ────────────────────────────────────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recSupported = !!SR;

if (recSupported) {
  try {
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;
  } catch(e) { recSupported = false; }
}

function normalizeWords(text) {
  return text.toLowerCase()
    .replace(/[''`]/g, "'")
    .replace(/[^a-z0-9'\s]/g, ' ')
    .split(/\s+/)
    .filter(w => w.length > 0);
}

function scoreWords(target, heard) {
  const tw = normalizeWords(target);
  const hw = new Set(normalizeWords(heard));
  const results = tw.map(w => ({ word: w, ok: hw.has(w) }));
  const score = Math.round((results.filter(r => r.ok).length / tw.length) * 100);
  return { results, score };
}

function showPronResult(target, heard) {
  const { results, score } = scoreWords(target, heard);
  const panel = document.getElementById('pronPanel');
  const circle = document.getElementById('pronCircle');
  const msg = document.getElementById('pronMsg');
  const words = document.getElementById('pronWords');
  const heardEl = document.getElementById('pronHeard');

  circle.textContent = score + '%';
  circle.className = 'pron-score-circle ' + (score >= 80 ? 'pron-score-high' : score >= 55 ? 'pron-score-mid' : 'pron-score-low');

  let emoji, text;
  if (score >= 90)      { emoji='🌟'; text='완벽한 발음이에요! 정말 훌륭해요!' }
  else if (score >= 75) { emoji='👍'; text='발음이 좋아요! 조금만 더 연습하면 완벽해질 거예요.' }
  else if (score >= 55) { emoji='💪'; text='열심히 하고 있어요! 표시된 단어를 더 연습해 봐요.' }
  else                  { emoji='📚'; text='천천히 다시 들어보고 한 단어씩 따라 말해봐요.' }
  msg.textContent = emoji + ' ' + text;

  words.innerHTML = results.map(r =>
    `<span class="pw ${r.ok ? 'pw-ok' : 'pw-no'}">${r.word}</span>`
  ).join('');

  heardEl.innerHTML = heard
    ? `내가 말한 것: <strong>"${heard}"</strong>`
    : '<span style="color:var(--warn)">음성을 인식하지 못했어요. 마이크를 확인하거나 더 크게 말해보세요.</span>';

  panel.classList.add('show');
}

function startRec() {
  if (!recSupported) {
    document.getElementById('recNotice').style.display = 'block';
    return;
  }
  const btn = document.getElementById('btnRec');
  const panel = document.getElementById('pronPanel');
  panel.classList.remove('show');

  btn.classList.add('recording');
  btn.textContent = '🎤 녹음 중…';
  btn.disabled = true;
  document.getElementById('btnTts').disabled = true;

  const target = SENTENCES[m1Order[m1Idx]].en;

  recognition.onresult = (e) => {
    const heard = Array.from(e.results[0])
      .map(alt => alt.transcript)
      .join(' ');
    showPronResult(target, heard);
  };
  recognition.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      recSupported = false;
      document.getElementById('recNotice').style.display = 'block';
    } else {
      showPronResult(target, '');
    }
  };
  recognition.onend = () => {
    btn.classList.remove('recording');
    btn.textContent = '🎤 다시 체크';
    btn.disabled = false;
    document.getElementById('btnTts').disabled = false;
  };

  try { recognition.start(); }
  catch(e) {
    btn.classList.remove('recording');
    btn.textContent = '🎤 발음 체크';
    btn.disabled = false;
    document.getElementById('btnTts').disabled = false;
    document.getElementById('recNotice').style.display = 'block';
  }
}

/* ── Audio cues ───────────────────────────────────────────────── */
let audioCtx = null;
function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, dur, vol=0.4, type='sine', delay=0) {
  try {
    const ctx = getACtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, ctx.currentTime+delay);
    g.gain.linearRampToValueAtTime(vol, ctx.currentTime+delay+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+dur);
    osc.start(ctx.currentTime+delay);
    osc.stop(ctx.currentTime+delay+dur+0.05);
  } catch(e) {}
}
const playWarn   = () => { beep(880,.15,.4,'sine',0); beep(880,.15,.4,'sine',.25) };
const playTick   = () => beep(1200,.08,.3,'sine',0);
const playFinish = () => { beep(523,.2,.5,'sine',0); beep(659,.2,.5,'sine',.22); beep(784,.4,.6,'sine',.44) };

/* ── Mode 1 ───────────────────────────────────────────────────── */
let m1Order=[], m1Idx=0, m1Scores={ok:0,no:0}, m1Flipped=false, wrongItems=[];

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function initM1() {
  m1Order=shuffle([...Array(SENTENCES.length).keys()]);
  m1Idx=0; m1Scores={ok:0,no:0}; m1Flipped=false; wrongItems=[];
  document.getElementById('result-wrap').hidden=true;
  document.getElementById('flipCard').classList.remove('flipped');
  document.getElementById('actionRow').classList.remove('visible');
  document.getElementById('pronPanel').classList.remove('show');
  document.getElementById('recNotice').style.display='none';
  if(synth) synth.cancel();
  updateM1UI(); enableJudge(false);
}

function updateM1UI() {
  const n=m1Idx+1, total=SENTENCES.length, s=SENTENCES[m1Order[m1Idx]];
  document.getElementById('prog-label').textContent=`${n} / ${total}`;
  document.getElementById('prog-fill').style.width=`${(n/total)*100}%`;
  document.getElementById('score-o').textContent=`⭕ ${m1Scores.ok}`;
  document.getElementById('score-x').textContent=`❌ ${m1Scores.no}`;
  document.getElementById('card-num-front').textContent=`No. ${n}`;
  document.getElementById('card-num-back').textContent=`No. ${n}`;
  document.getElementById('card-korean').textContent=s.kr;
  document.getElementById('card-english').textContent=s.en;
}

function flipCard() {
  m1Flipped=!m1Flipped;
  document.getElementById('flipCard').classList.toggle('flipped',m1Flipped);
  enableJudge(m1Flipped);
  document.getElementById('actionRow').classList.toggle('visible',m1Flipped);
  document.getElementById('pronPanel').classList.remove('show');
  if(m1Flipped) {
    // auto-play TTS after card flip animation
    setTimeout(() => speakCard(), 580);
  } else {
    if(synth) synth.cancel();
    const btn=document.getElementById('btnTts');
    btn.classList.remove('speaking'); btn.textContent='🔊 영어 듣기'; btn.disabled=false;
    const rbtn=document.getElementById('btnRec');
    rbtn.classList.remove('recording'); rbtn.textContent='🎤 발음 체크'; rbtn.disabled=false;
  }
}

function enableJudge(on) {
  document.getElementById('btnOk').disabled=!on;
  document.getElementById('btnNo').disabled=!on;
}

function judge(ok) {
  if(ok) m1Scores.ok++; else { m1Scores.no++; wrongItems.push(SENTENCES[m1Order[m1Idx]]); }
  m1Idx++;
  if(m1Idx>=SENTENCES.length){ showResult(); return; }
  m1Flipped=false;
  if(synth) synth.cancel();
  document.getElementById('flipCard').classList.remove('flipped');
  document.getElementById('actionRow').classList.remove('visible');
  document.getElementById('pronPanel').classList.remove('show');
  enableJudge(false);
  updateM1UI();
}

function showResult() {
  document.getElementById('result-wrap').hidden=false;
  document.getElementById('result-wrap').scrollIntoView({behavior:'smooth'});
  const total=SENTENCES.length, ok=m1Scores.ok, pct=Math.round(ok/total*100);
  document.getElementById('result-score').innerHTML=`${ok}<span> / ${total}</span>`;
  let emoji='🌟',title='완벽해요!',sub='모든 문장을 완벽하게 말했어요! 정말 대단해요 👏';
  if(pct<60){emoji='😅';title='더 연습해요!';sub=`${ok}개 맞혔어요. 틀린 문장을 집중적으로 연습해 봐요!`}
  else if(pct<80){emoji='👍';title='잘했어요!';sub=`${ok}개 맞혔어요. 조금만 더 연습하면 완벽해질 거예요!`}
  else if(pct<100){emoji='🎉';title='훌륭해요!';sub=`${ok}개 맞혔어요. 거의 다 했어요!`}
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-title').textContent=title;
  document.getElementById('result-sub').textContent=sub;
  const wl=document.getElementById('wrong-list'),wi=document.getElementById('wrong-items');
  if(wrongItems.length){ wl.hidden=false; wi.innerHTML=wrongItems.map(s=>`<div class="wrong-item"><div class="kr">${s.kr}</div><div class="en">${s.en}</div></div>`).join(''); }
  else wl.hidden=true;
}

function restartM1() { initM1(); }

/* ── Mode 2 ───────────────────────────────────────────────────── */
let m2Sentences=[], timerInterval=null, timeLeft=60, timerRunning=false;
const FULL_CIRC=201.06;

function newChallenge() {
  clearTimer();
  if(synth) synth.cancel();
  m2Sentences=shuffle([...Array(SENTENCES.length).keys()]).slice(0,6);
  document.getElementById('finishBanner').classList.remove('show');
  document.getElementById('startBtn').disabled=false;
  document.getElementById('startBtn').textContent='▶ 시작!';
  resetTimerUI();
  renderSentences();
}

function renderSentences() {
  document.getElementById('sentenceList').innerHTML=m2Sentences.map((idx,i)=>{
    const s=SENTENCES[idx];
    return `<div class="sentence-item" id="si${i}">
      <div class="s-num">${i+1}</div>
      <div class="s-body">
        <div class="s-korean">${s.kr}</div>
        <div class="s-english" id="se${i}">${s.en}</div>
        <div class="s-btn-row">
          <button class="s-tts-btn" id="stts${i}" onclick="speakSentence(${i},this)">🔊 듣기</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function startTimer() {
  if(timerRunning) return;
  try{ getACtx().resume(); }catch(e){}
  timerRunning=true;
  document.getElementById('startBtn').disabled=true;
  document.getElementById('startBtn').textContent='진행 중…';
  timeLeft=60; updateTimerUI();
  timerInterval=setInterval(()=>{
    timeLeft--; updateTimerUI();
    if(timeLeft===10) playWarn();
    if(timeLeft<=5&&timeLeft>0) playTick();
    if(timeLeft<=0){
      clearTimer(); playFinish();
      document.getElementById('finishBanner').classList.add('show');
      document.getElementById('finishBanner').scrollIntoView({behavior:'smooth'});
    }
  },1000);
}

function clearTimer() {
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  timerRunning=false;
}

function resetTimerUI() {
  timeLeft=60;
  document.getElementById('timerNum').textContent='60';
  document.getElementById('timerNum').style.color='';
  const arc=document.getElementById('timerArc');
  arc.style.strokeDashoffset='0'; arc.style.stroke='';
}

function updateTimerUI() {
  const num=document.getElementById('timerNum'), arc=document.getElementById('timerArc');
  num.textContent=timeLeft;
  arc.style.strokeDashoffset=FULL_CIRC*(1-timeLeft/60);
  if(timeLeft<=5){ arc.style.stroke='var(--danger)'; num.style.color='var(--danger)'; }
  else if(timeLeft<=10){ arc.style.stroke='var(--warn)'; num.style.color='var(--warn)'; }
  else { arc.style.stroke=''; num.style.color=''; }
}

function revealAll() {
  m2Sentences.forEach((_,i)=>{
    document.getElementById(`se${i}`).classList.add('show');
    document.getElementById(`si${i}`).classList.add('revealed');
    // auto-play all sequentially
    speakSentence(i, document.getElementById(`stts${i}`));
  });
}

/* ── Tab ─────────────────────────────────────────────────────── */
function switchTab(n) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===n-1));
  document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===n-1));
  if(synth) synth.cancel();
}

/* ── Init ────────────────────────────────────────────────────── */
// Load voices asynchronously
if(synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = () => synth.getVoices();
synth && synth.getVoices();

initM1();
newChallenge();
</script>
